name: CI DevOps

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t aplicacao-devops:test .

      - name: Validar Docker Compose
        run: docker compose config
